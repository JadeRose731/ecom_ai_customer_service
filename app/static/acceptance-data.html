<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MewHelp · 验收·数据产物</title>
<link rel="stylesheet" href="/static/acceptance.css">
<style>
  .flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .flow .seg { background: var(--brand-soft); border-radius: 10px; padding: 6px 12px; font-size: 13px; }
  .flow .seg b { font-size: 15px; }
  .flow .seg.dim { background: #f2f3f6; color: var(--muted); }
  .flow .arr { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🐱</div>
    <div><h1>验收·数据产物</h1><div class="sub">血缘、考卷泄漏自检与训练三件套——只盘点落盘文件,不重算</div></div>
    <button id="refresh">↻ 刷新</button>
  </header>
  <div data-admin-nav-anchor></div>
  <div class="card" id="jobs-card"><h2>作业</h2><div id="jobs"></div></div>
  <div id="root"></div>
</div>
<script src="/static/admin.js"></script>
<script src="/static/acceptance.js"></script>
<script>
(function () {
  'use strict';
  const A = window.Acceptance;
  const JOBS = ['ch10-golden', 'ch10-corpus', 'ch10-dataset', 'ch10-train', 'ch10-export'];
  const root = document.getElementById('root');

  function card(title, why) {
    const c = document.createElement('div');
    c.className = 'card';
    const h = document.createElement('h2');
    h.textContent = title;
    c.appendChild(h);
    if (why) {
      const w = document.createElement('div');
      w.className = 'why';
      w.textContent = why;
      c.appendChild(w);
    }
    return c;
  }

  function fileTable(files) {
    if (!files.length) {
      const d = document.createElement('div');
      d.className = 'why';
      d.textContent = '(还没有文件)';
      return d;
    }
    const t = document.createElement('table');
    t.className = 't';
    const tr = document.createElement('tr');
    ['文件', '大小', '行数', 'mtime'].forEach((h) => {
      const th = document.createElement('th');
      th.textContent = h;
      tr.appendChild(th);
    });
    t.appendChild(tr);
    files.forEach((f) => {
      const tr = document.createElement('tr');
      const td = (s) => {
        const d = document.createElement('td');
        d.className = 'num';
        d.textContent = s;
        return d;
      };
      const name = document.createElement('td');
      name.textContent = f.name;
      tr.appendChild(name);
      tr.appendChild(td(A.fmtBytes(f.bytes)));
      tr.appendChild(td(f.lines == null ? '—' : f.lines));
      tr.appendChild(td(f.mtime));
      t.appendChild(tr);
    });
    return t;
  }

  async function load() {
    const body = await A.api('/api/acceptance/data');
    const jobsMeta = (await A.api('/api/jobs')).jobs;
    const jc = document.getElementById('jobs');
    jc.innerHTML = '';
    JOBS.forEach((n) => jc.appendChild(A.jobRow(n, jobsMeta[n], load)));

    root.innerHTML = '';

    /* 语料血缘:raw → clean → labeled → 抽审 */
    const c1 = card('语料血缘', '原始对话 → 清洗 → 预标 → 人工抽审样例;每段条数来自落盘文件的行数。');
    const flow = document.createElement('div');
    flow.className = 'flow';
    const segs = [
      ['原始 ' + (body.lineage.raw ? body.lineage.raw.lines + ' 条' : '缺'), !!body.lineage.raw],
      ['清洗 ' + (body.lineage.clean ? body.lineage.clean.lines + ' 条' : '缺'), !!body.lineage.clean],
      ['预标 ' + (body.lineage.labeled ? body.lineage.labeled.lines + ' 条' : '缺'), !!body.lineage.labeled],
      ['抽审样例 ' + (body.sample_review ? body.sample_review.lines + ' 行' : '缺'), !!body.sample_review],
    ];
    segs.forEach(([txt, ok], i) => {
      if (i) {
        const a = document.createElement('span');
        a.className = 'arr';
        a.textContent = '→';
        flow.appendChild(a);
      }
      const s = document.createElement('span');
      s.className = 'seg' + (ok ? '' : ' dim');
      s.textContent = txt;
      flow.appendChild(s);
    });
    c1.appendChild(flow);
    root.appendChild(c1);

    /* 三份考卷分布 + 泄漏硬闸 */
    const ds = body.dataset;
    if (!ds.ready) {
      root.appendChild(A.missingBox('点按钮或终端 make ch10-dataset 生成产物', '考卷还没生成'));
    } else {
      const c2 = card('三份考卷的类目分布', '行是 17 个类目,列是 train / val / test;表下是两两文本重叠的泄漏自检——硬闸,重叠必须为 0。');
      const t = document.createElement('table');
      t.className = 't';
      const head = document.createElement('tr');
      ['类目', 'train', 'val', 'test'].forEach((h) => {
        const th = document.createElement('th');
        th.textContent = h;
        head.appendChild(th);
      });
      t.appendChild(head);
      body.topic_names.forEach((nm) => {
        const tr = document.createElement('tr');
        const name = document.createElement('td');
        name.textContent = nm;
        tr.appendChild(name);
        ['train', 'val', 'test'].forEach((k) => {
          const d = document.createElement('td');
          d.className = 'num';
          d.textContent = (ds.splits[k].dist[nm] || 0);
          tr.appendChild(d);
        });
        t.appendChild(tr);
      });
      const total = document.createElement('tr');
      total.innerHTML = '<td><b>合计</b></td>' + ['train', 'val', 'test']
        .map((k) => '<td class="num"><b>' + ds.splits[k].lines + '</b></td>').join('');
      t.appendChild(total);
      c2.appendChild(t);
      const leak = document.createElement('div');
      leak.className = 'why';
      leak.style.marginTop = '8px';
      leak.innerHTML = ds.clean
        ? '<span class="pill st-pass">✅ 零重叠:train×val ' + ds.leaks['train×val'] + ' · train×test '
          + ds.leaks['train×test'] + ' · val×test ' + ds.leaks['val×test'] + '</span>'
        : '<span class="pill st-fail">🔴 考卷互相泄漏(共 ' + (ds.leaks['train×val'] + ds.leaks['train×test'] + ds.leaks['val×test'])
          + ' 条)——回 build_dataset 查划分</span>';
      c2.appendChild(leak);
      root.appendChild(c2);
    }

    /* 训练三件套 + ONNX */
    const duo = document.createElement('div');
    duo.className = 'card';
    duo.style.display = 'grid';
    duo.style.gridTemplateColumns = 'repeat(auto-fit, minmax(320px, 1fr))';
    duo.style.gap = '16px';
    const m = card('训练三件套(权重 + tokenizer + 阈值)');
    m.innerHTML = body.model.present
      ? '<div class="why">在用阈值 ' + (body.model.threshold ? body.model.threshold.threshold : '—')
        + '(验证集 F1 ' + (body.model.threshold ? body.model.threshold.val_micro_f1 : '—') + ')</div>'
      : '<div class="why">还没训出模型——点「ch10-train」(CPU 上是分钟级重活)</div>';
    m.appendChild(fileTable(body.model.files));
    const o = card('ONNX 导出产物');
    o.innerHTML = body.onnx.present
      ? '<div class="why">服务在用阈值 ' + (body.onnx.threshold ? body.onnx.threshold.threshold : '—') + '</div>'
      : '<div class="why">还没导出——点「ch10-export」</div>';
    o.appendChild(fileTable(body.onnx.files));
    duo.appendChild(m);
    duo.appendChild(o);
    root.appendChild(duo);

    /* 文件盘点 */
    const all = [];
    ['raw', 'clean', 'labeled'].forEach((k) => { if (body.lineage[k]) all.push(body.lineage[k]); });
    if (body.sample_review) all.push(body.sample_review);
    ['train', 'val', 'test'].forEach((k) => {
      if (ds.splits[k].present) {
        all.push({ name: k + '.jsonl', bytes: null, mtime: '', lines: ds.splits[k].lines });
      }
    });
    const c3 = card('文件盘点', '行数只对 jsonl/md 计;config/tokenizer 这类算行数是噪声。');
    c3.appendChild(fileTable(all));
    root.appendChild(c3);

    /* 主题分布降级提示 */
    if (!body.topics.present) {
      root.appendChild(A.missingBox(body.topics.hint, '主题分布暂缺'));
    }
  }

  document.getElementById('refresh').addEventListener('click', () => {
    load().catch((e) => A.toast(e.message, 'err'));
  });
  mountAdminNav('acceptance');
  load().catch((e) => { root.appendChild(A.missingBox(e.message, '取数失败')); });
})();
</script>
</body>
</html>
