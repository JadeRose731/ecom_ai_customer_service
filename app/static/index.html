<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵优选 · 智能客服小喵</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1f2430; --muted: #8a93a6;
    --brand: #ff7a45; --brand-soft: #fff1ea; --line: #e6e9f0; --bubble-bot: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .app { max-width: 760px; margin: 24px auto; height: calc(100vh - 48px); display: flex; flex-direction: column;
         background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 6px 30px rgba(31,36,48,.06); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 18px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header button { margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--ink);
                  padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  header button:hover { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .row.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .row.bot { flex-direction: column; align-items: flex-start; gap: 2px; }
  .bubble-wrap { max-width: 78%; display: flex; flex-direction: column; gap: 6px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool-badge { font-size: 12px; color: #6b7280; background: #f3f4f6; border: 1px dashed #c7ccd6;
                border-radius: 999px; padding: 2px 10px; }
  .md { white-space: normal; }
  .md h1, .md h2, .md h3 { font-size: 14px; margin: 6px 0 2px; }
  .md p { margin: 4px 0; }
  .md ul, .md ol { margin: 4px 0 4px 18px; }
  .md code { background: #f3f4f6; border-radius: 4px; padding: 1px 5px; font-family: Consolas, monospace; font-size: 13px; }
  .md pre { background: #f3f4f6; border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line); color: var(--muted); padding-left: 10px; margin: 6px 0; }
  .md table { border-collapse: collapse; margin: 6px 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; }
  .md a { color: var(--brand); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #c2c8d4; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .error { color: #d03050; font-size: 13px; }
  /* ch04 可点引用角标 + 来源浮层 */
  .cite { color: var(--brand); cursor: pointer; font-weight: 600; margin: 0 1px; user-select: none; }
  .cite:hover { text-decoration: underline; }
  #cite-panel { position: fixed; z-index: 50; max-width: 420px; background: #fff; border: 1px solid var(--line);
                border-radius: 12px; box-shadow: 0 10px 34px rgba(31,36,48,.16); padding: 12px 14px;
                display: none; font-size: 13px; }
  #cite-panel.show { display: block; }
  #cite-panel .cp-path { color: var(--brand); font-weight: 600; margin-bottom: 6px; }
  #cite-panel .cp-q { font-weight: 600; margin-bottom: 4px; }
  #cite-panel .cp-a { color: #4b5563; white-space: pre-wrap; }
  #cite-panel .cp-empty { color: var(--muted); }
  /* ch04 每段回答满意度反馈(一次性,不落库) */
  .feedback { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .fb-btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px;
            padding: 3px 10px; cursor: pointer; box-shadow: 0 2px 0 var(--line); font-size: 12px; }
  .fb-btn:active { transform: translateY(2px); box-shadow: none; }
  .fb-btn.active { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .fb-btn.dim { opacity: .4; pointer-events: none; }
  .fb-done { color: var(--muted); }
  /* ch05 建议动作按钮 + 工单表单弹窗(ch06 退款弹窗复用同款规则) */
  .action-bar { display: flex; gap: 8px; margin-top: 2px; }
  .action-btn { border: 1px solid var(--brand); background: #fff; color: var(--brand); border-radius: 8px;
                padding: 5px 14px; cursor: pointer; font-size: 13px; }
  .action-btn:hover:not(:disabled) { background: var(--brand-soft); }
  .action-btn:disabled { border-color: var(--line); color: var(--muted); background: #f3f4f6; cursor: not-allowed; }
  #ticket-mask, #refund-mask { position: fixed; inset: 0; background: rgba(31,36,48,.4); display: none; z-index: 100;
                 align-items: center; justify-content: center; }
  #ticket-mask.show, #refund-mask.show { display: flex; }
  #ticket-modal, #refund-modal { width: min(420px, 92vw); background: #fff; border-radius: 14px; padding: 18px;
                  box-shadow: 0 12px 40px rgba(31,36,48,.2); }
  #ticket-modal h3, #refund-modal h3 { font-size: 15px; margin-bottom: 4px; }
  #ticket-modal label, #refund-modal label { display: block; font-size: 13px; margin: 10px 0 4px; }
  #ticket-modal select, #ticket-modal textarea,
  #refund-modal select, #refund-modal input { width: 100%; border: 1px solid var(--line); border-radius: 8px;
                                                 padding: 8px 10px; font: inherit; outline: none; background: #fff; }
  #ticket-modal select:focus, #ticket-modal textarea:focus,
  #refund-modal select:focus, #refund-modal input:focus { border-color: var(--brand); }
  #ticket-modal textarea { height: 84px; resize: vertical; }
  #refund-modal input[readonly] { background: #f3f4f6; color: var(--muted); }
  #ticket-modal .err, #refund-modal .err { color: #d03050; font-size: 12px; min-height: 16px; margin-top: 6px; }
  #ticket-modal .btns, #refund-modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #ticket-modal .btns button, #refund-modal .btns button { border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 13px;
                               border: 1px solid var(--line); background: #fff; }
  #ticket-modal .btns .primary, #refund-modal .btns .primary { border: none; background: var(--brand); color: #fff; }
  /* ch06 订单选择器卡片(interrupt 帧):可点、hover 高亮、点选后整组禁用灰态 */
  .order-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .order-card { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; text-align: left;
                border: 1px solid var(--line); background: #fff; border-radius: 10px;
                padding: 8px 12px; cursor: pointer; font: inherit; }
  .order-card:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
  .order-card:disabled { cursor: not-allowed; opacity: .55; }
  .order-card.selected { border-color: var(--brand); background: var(--brand-soft); opacity: 1; }
  .order-card .oc-id { font-weight: 600; }
  .order-card .oc-status { font-size: 12px; color: #6b7280; background: #f3f4f6; border-radius: 999px; padding: 1px 8px; }
  .order-card .oc-amount { margin-left: auto; color: var(--brand); font-weight: 600; }
  .order-card .oc-meta { flex-basis: 100%; font-size: 12px; color: var(--muted); }
  footer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
           font: inherit; outline: none; height: 44px; }
  #input:focus { border-color: var(--brand); }
  #send { border: none; background: var(--brand); color: #fff; border-radius: 10px; padding: 0 20px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🐱</div>
    <div>
      <h1>喵喵优选 · 智能客服</h1>
      <div class="sub">小喵为您服务,订单 / 物流 / 售后都可以问我</div>
    </div>
    <button id="newChat">+ 新对话</button>
    <button onclick="location.href='/admin'">后台管理</button>
  </header>
  <div id="chat"></div>
  <div id="cite-panel"></div>
  <div id="ticket-mask">
    <div id="ticket-modal" role="dialog" aria-modal="true">
      <h3>创建工单</h3>
      <label for="ticket-type">反馈类别(必选)</label>
      <select id="ticket-type">
        <option value="">请选择</option>
        <option value="售后">售后</option>
        <option value="投诉">投诉</option>
        <option value="咨询">咨询</option>
      </select>
      <label for="ticket-desc">反馈描述(必填)</label>
      <textarea id="ticket-desc" placeholder="请描述您遇到的问题…"></textarea>
      <div class="err" id="ticket-err"></div>
      <div class="btns">
        <button id="ticket-cancel" type="button">取消</button>
        <button id="ticket-submit" type="button" class="primary">提交工单</button>
      </div>
    </div>
  </div>
  <div id="refund-mask">
    <div id="refund-modal" role="dialog" aria-modal="true">
      <h3>提交退款工单</h3>
      <label for="refund-order">订单号</label>
      <input id="refund-order" readonly>
      <label for="refund-reason">退款原因(必选)</label>
      <select id="refund-reason">
        <option value="">请选择</option>
        <option value="七天无理由">七天无理由</option>
        <option value="质量问题">质量问题</option>
        <option value="发错货">发错货</option>
        <option value="不想要了">不想要了</option>
        <option value="其他">其他</option>
      </select>
      <div class="err" id="refund-err"></div>
      <div class="btns">
        <button id="refund-cancel" type="button">取消</button>
        <button id="refund-submit" type="button" class="primary">提交退款</button>
      </div>
    </div>
  </div>
  <footer>
    <textarea id="input" placeholder="输入消息,Enter 发送,Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </footer>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const UID_KEY = 'mewhelp_user_id', CID_KEY = 'mewhelp_conversation_id';

let userId = localStorage.getItem(UID_KEY);
if (!userId) {
  userId = 'u-' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem(UID_KEY, userId);
}
let conversationId = localStorage.getItem(CID_KEY);
let sending = false;

function appendUser(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function appendBotShell() {
  const row = document.createElement('div');
  row.className = 'row bot';
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const tools = document.createElement('div');
  tools.className = 'tools';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const dots = document.createElement('span');
  dots.className = 'dots';
  dots.innerHTML = '<i></i><i></i><i></i>';
  bubble.appendChild(dots);
  wrap.appendChild(tools);
  wrap.appendChild(bubble);
  row.appendChild(wrap);
  chatEl.appendChild(row);
  scrollBottom();
  return { row, wrap, tools, bubble, raw: '', firstDelta: false, citations: [] };
}

function addBadge(shell, name) {
  const badge = document.createElement('span');
  badge.className = 'tool-badge';
  badge.textContent = '🔧 调用了 ' + name;
  shell.tools.appendChild(badge);
  scrollBottom();
}

function firstDelta(shell) {
  if (shell.firstDelta) return;
  shell.firstDelta = true;
  shell.bubble.classList.add('md');
  shell.bubble.textContent = '';
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

/* ---------- ch04:来源浮层 + 满意度反馈 ---------- */
function showCitePanel(x, y, item) {
  const panel = document.getElementById('cite-panel');
  if (!item) {
    panel.innerHTML = '<div class="cp-empty">未找到该编号的引用</div>';
  } else {
    panel.innerHTML = '<div class="cp-path">📄 ' + esc(item.section_path || '(无章节路径)')
      + '</div><div class="cp-q">' + esc(item.question || '') + '</div>'
      + '<div class="cp-a">' + esc(item.answer || '') + '</div>';
  }
  panel.classList.add('show');
  const r = panel.getBoundingClientRect();
  panel.style.left = Math.min(x, window.innerWidth - r.width - 12) + 'px';
  panel.style.top = Math.min(y + 12, window.innerHeight - r.height - 12) + 'px';
}
function hideCitePanel() { document.getElementById('cite-panel').classList.remove('show'); }

// 气泡内容逐帧 innerHTML 重绘,角标监听用事件委托挂在 document 上
document.addEventListener('click', (e) => {
  const cite = e.target.closest('.cite');
  if (cite) {
    const bubble = cite.closest('.bubble');
    const items = (bubble && bubble.citations) || [];
    const item = items.find((it) => Number(it.n) === Number(cite.dataset.n));
    showCitePanel(e.clientX, e.clientY, item);
    e.stopPropagation();
    return;
  }
  if (!e.target.closest('#cite-panel')) hideCitePanel();
});

function addFeedbackBar(shell) {
  const bar = document.createElement('div');
  bar.className = 'feedback';
  const up = document.createElement('button');
  up.className = 'fb-btn'; up.textContent = '👍 有帮助';
  const down = document.createElement('button');
  down.className = 'fb-btn'; down.textContent = '👎 没帮助';
  const note = document.createElement('span');
  bar.appendChild(up); bar.appendChild(down); bar.appendChild(note);
  let locked = false;
  const pick = (good, chosen, other) => () => {
    if (locked) return;
    locked = true;
    chosen.classList.add('active');
    other.classList.add('dim');
    note.textContent = '已反馈';
    // 纯前端一次性交互,不落库(反馈入问题池 source=user_feedback 归后续数据飞轮章)
  };
  up.addEventListener('click', pick(true, up, down));
  down.addEventListener('click', pick(false, down, up));
  shell.wrap.appendChild(bar);
  scrollBottom();
}

/* ---------- 零依赖 markdown 渲染(先转义防注入,再逐帧重绘) ---------- */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(?<!["'=])(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    // ch04:答案里的 [n] 编号 → 可点角标(点击弹出来源浮层)
    .replace(/\[(\d{1,2})\]/g, '<sup class="cite" data-n="$1">[$1]</sup>');
}
function renderMarkdown(el, raw) {
  const lines = esc(raw).split('\n');
  let html = '', i = 0;
  const isTableSep = (l) => /^\s*\|(\s*:?-{3,}:?\s*\|)+\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      html += '<pre><code>' + buf.join('\n') + '</code></pre>';
      continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { html += '<hr>'; i++; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      html += '<blockquote>' + inline(buf.join(' ')) + '</blockquote>';
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      html += '<table><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>';
      for (const r of rows) html += '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      html += '</table>';
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
      html += '<ul>' + buf.map((t) => '<li>' + inline(t) + '</li>').join('') + '</ul>';
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; }
      html += '<ol>' + buf.map((t) => '<li>' + inline(t) + '</li>').join('') + '</ol>';
      continue;
    }
    const buf = [line];
    i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|```|\s*>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) { buf.push(lines[i]); i++; }
    html += '<p>' + inline(buf.join('<br>')) + '</p>';
  }
  el.innerHTML = html;
  scrollBottom();
}

/* ---------- ch05 建议动作(转人工 / 建工单) ---------- */
function addBotText(text) {
  const row = document.createElement('div');
  row.className = 'row bot';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function renderActions(container, items) {
  const bar = document.createElement('div');
  bar.className = 'action-bar';
  for (const a of items) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'action-btn';
    if (a.type === 'transfer_human') {
      btn.textContent = '转人工';
      btn.addEventListener('click', () => {
        btn.disabled = true;
        // 纯前端模拟:显示已转接 + 客服小猫问候(本章不接真人系统)
        addBotText('已转接人工客服');
        addBotText('您好,我是客服小猫,请问有什么可以帮您的');
      });
    } else if (a.type === 'create_ticket') {
      btn.textContent = '建工单';
      btn.addEventListener('click', () => openTicketModal(btn));
    } else if (a.type === 'refund_form') {
      // ch06:退款表单入口——订单号只读预填,弹窗里选固定类目原因后 POST create-refund
      btn.textContent = '提交退款工单';
      btn.addEventListener('click', () => openRefundModal(btn, a.draft && a.draft.order_id));
    } else {
      continue;
    }
    bar.appendChild(btn);
  }
  if (bar.children.length) container.appendChild(bar);
  scrollBottom();
}

let ticketBtn = null;
function openTicketModal(btn) {
  ticketBtn = btn || null;
  document.getElementById('ticket-type').value = '';   // 类别不预选,必选
  document.getElementById('ticket-desc').value = '';   // 描述不预填草稿,必填
  document.getElementById('ticket-err').textContent = '';
  document.getElementById('ticket-mask').classList.add('show');
}
function closeTicketModal() {
  document.getElementById('ticket-mask').classList.remove('show');
}

async function submitTicket() {
  const t = document.getElementById('ticket-type').value;
  const d = document.getElementById('ticket-desc').value.trim();
  const err = document.getElementById('ticket-err');
  if (!t) { err.textContent = '请选择反馈类别'; return; }
  if (!d) { err.textContent = '请填写反馈描述'; return; }
  err.textContent = '';
  try {
    const resp = await fetch('/api/actions/create-ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: Number(conversationId),
        description: d,
        ticket_type: t,
      }),
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.ok) {
      addBotText('工单已创建:' + data.ticket_no);
      if (ticketBtn) ticketBtn.disabled = true;
      closeTicketModal();
    } else {
      err.textContent = data.detail || '工单创建失败,请稍后重试';
    }
  } catch (e) {
    err.textContent = '工单创建失败,请稍后重试';
  }
  scrollBottom();
}
document.getElementById('ticket-cancel').addEventListener('click', closeTicketModal);
document.getElementById('ticket-mask').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeTicketModal();
});
document.getElementById('ticket-submit').addEventListener('click', submitTicket);

/* ---------- ch06 退款表单弹窗(消费 refund_form 动作) ---------- */
let refundBtn = null;
function openRefundModal(btn, orderId) {
  refundBtn = btn || null;
  document.getElementById('refund-order').value = orderId || '';   // 订单号只读预填
  document.getElementById('refund-reason').value = '';             // 固定类目不预选,必选
  document.getElementById('refund-err').textContent = '';
  document.getElementById('refund-mask').classList.add('show');
}
function closeRefundModal() {
  document.getElementById('refund-mask').classList.remove('show');
}
async function submitRefund() {
  const oid = document.getElementById('refund-order').value.trim();
  const reason = document.getElementById('refund-reason').value;
  const err = document.getElementById('refund-err');
  if (!oid) { err.textContent = '缺少订单号'; return; }
  if (!reason) { err.textContent = '请选择退款原因'; return; }
  const cid = getConversationId();
  if (!cid) { err.textContent = '会话尚未建立,请重试'; return; }
  err.textContent = '';
  try {
    const resp = await fetch('/api/actions/create-refund', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: cid, order_id: oid, reason: reason }),
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.ok) {
      addBotText((data.status || '退款申请已提交') + ':' + data.ticket_no);
      if (refundBtn) refundBtn.disabled = true;
      closeRefundModal();
    } else {
      err.textContent = data.detail || '退款提交失败,请稍后重试';
    }
  } catch (e) {
    err.textContent = '退款提交失败,请稍后重试';
  }
  scrollBottom();
}
document.getElementById('refund-cancel').addEventListener('click', closeRefundModal);
document.getElementById('refund-mask').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeRefundModal();
});
document.getElementById('refund-submit').addEventListener('click', submitRefund);

/* ---------- SSE 流式(chat 与 resume 共用同一套消费函数) ---------- */
function parseFrame(frame) {
  let event = 'message';
  const dataLines = [];
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
  }
  return { event, data: dataLines.join('\n') };
}

// 读 SSE 帧 → 分发渲染进 bot 气泡;chat 与 resume 各自 fetch 后都交给它。
// interrupt 帧后服务端立即结束流(无 done 帧),这不是错误,由 renderOrderCards 接管。
async function consumeSSE(resp, shell) {
  let errorShown = false;
  let pendingActions = [];
  const handleFrame = (frame) => {
    const { event, data } = parseFrame(frame);
    if (event === 'error') {
      let msg = '服务暂时不可用,请稍后重试';
      try { msg = JSON.parse(data).message; } catch (e) {}
      shell.bubble.classList.remove('md');
      shell.bubble.innerHTML = '<span class="error">⚠️ ' + esc(msg) + '</span>';
      errorShown = true;
      return;
    }
    if (!data || data === '[DONE]') return;
    let payload;
    try { payload = JSON.parse(data); } catch (e) { return; }
    if (payload.event === 'tool') {
      addBadge(shell, payload.name);
    } else if (payload.event === 'citations') {
      // ch04:引用数据先挂到气泡上,citations 事件先于 delta 下发
      shell.citations = payload.items || [];
      shell.bubble.citations = shell.citations;
    } else if (payload.event === 'actions') {
      // ch05:转人工/建工单/退款表单等建议动作,流结束后渲染
      pendingActions = payload.items || [];
    } else if (payload.event === 'interrupt') {
      // R15:interrupt 帧自带 conversation_id(中断流无 done 帧),优先采用;done 帧处理保留为常规回退
      if (payload.conversation_id !== undefined) {
        conversationId = String(payload.conversation_id);
        localStorage.setItem(CID_KEY, conversationId);
      }
      if (!shell.interrupted) renderOrderCards(shell, payload.orders || []);
    } else if (payload.event === 'done') {
      conversationId = String(payload.conversation_id);
      localStorage.setItem(CID_KEY, conversationId);
    } else if (payload.delta !== undefined) {
      shell.raw += payload.delta;
      renderMarkdown(shell.bubble, shell.raw);
    }
  };
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (frame.trim()) handleFrame(frame);
    }
  }
  // interrupt 流:气泡已换成引导语,不再补「…」;无反馈条(还没产生回答)
  if (!shell.firstDelta && !errorShown && !shell.interrupted) shell.bubble.textContent = '…';
  if (shell.firstDelta && !errorShown) addFeedbackBar(shell);
  if (pendingActions.length && !errorShown) renderActions(shell.wrap, pendingActions);
}

async function postSSE(url, body) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
  return resp;
}

async function streamChat(message) {
  const shell = appendBotShell();
  try {
    const resp = await postSSE('/api/chat', {
      user_id: userId,
      message: message,
      conversation_id: conversationId ? Number(conversationId) : null,
    });
    await consumeSSE(resp, shell);
  } catch (err) {
    shell.bubble.classList.remove('md');
    shell.bubble.innerHTML = '<span class="error">⚠️ 网络异常,请稍后重试</span>';
  }
}

/* ---------- ch06 订单选择器(interrupt 帧)→ resume 续流 ---------- */
function getConversationId() {
  return conversationId ? Number(conversationId) : null;
}

function renderOrderCards(shell, orders) {
  shell.interrupted = true;
  if (!shell.firstDelta) shell.bubble.textContent = '请选择要处理的订单:';
  const group = document.createElement('div');
  group.className = 'order-cards';
  for (const o of orders) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'order-card';
    card.innerHTML =
      '<span class="oc-id">订单 ' + esc(String(o.order_id ?? '')) + '</span>'
      + '<span class="oc-status">' + esc(String(o.status ?? '')) + '</span>'
      + '<span class="oc-amount">¥' + esc(String(o.amount ?? '')) + '</span>'
      + '<span class="oc-meta">' + esc(String(o.product ?? '')) + ' · 运单 '
      + esc(String(o.tracking_no ?? '—')) + ' · ' + esc(String(o.created_at ?? '')) + '</span>';
    card.addEventListener('click', () => {
      if (card.disabled) return;
      const cid = getConversationId();
      if (!cid) return; // R15 之前的历史中断残留卡片可能无 cid,无从 resume,静默忽略
      // 点选后全部卡片组禁用灰态(含历史中断残留的卡片组),当前卡片高亮
      document.querySelectorAll('.order-card').forEach((c) => { c.disabled = true; });
      card.classList.add('selected');
      resumeWithOrder(cid, String(o.order_id));
    });
    group.appendChild(card);
  }
  shell.wrap.appendChild(group);
  scrollBottom();
}

async function resumeWithOrder(cid, orderId) {
  sending = true;
  sendEl.disabled = true;
  const shell = appendBotShell();
  try {
    const resp = await postSSE('/api/actions/resume', { conversation_id: cid, order_id: orderId });
    await consumeSSE(resp, shell);
  } catch (err) {
    shell.bubble.classList.remove('md');
    shell.bubble.innerHTML = '<span class="error">⚠️ 续流失败,请稍后重试</span>';
  } finally {
    sending = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  sending = true;
  sendEl.disabled = true;
  inputEl.value = '';
  appendUser(text);
  await streamChat(text);
  sending = false;
  sendEl.disabled = false;
  inputEl.focus();
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('newChat').addEventListener('click', () => {
  conversationId = null;
  localStorage.removeItem(CID_KEY);
  chatEl.innerHTML = '';
  inputEl.focus();
});
inputEl.focus();
