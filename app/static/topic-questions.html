<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MewHelp · 类目问题</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1f2430; --muted: #8a93a6;
    --brand: #ff7a45; --brand-soft: #fff1ea; --line: #e6e9f0;
    --blue: #3b82f6; --amber: #d97706; --red: #d03050; --green: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff;
                 display: grid; place-items: center; font-size: 18px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  /* 类目一排:按问题量排开,当前类高亮;类目与页码都走地址栏 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
          background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 13px;
          color: var(--ink); text-decoration: none; }
  .chip i { font-style: normal; font-size: 12px; color: var(--muted); }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip.on i { color: #ffd9c6; }
  /* 一行一条问题 */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 12px 16px; box-shadow: 0 6px 30px rgba(31,36,48,.06); }
  .card .text { font-weight: 600; font-size: 14px; }
  .card .rawline { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px;
          font-size: 12px; color: var(--muted); }
  .lb { font-size: 12px; border-radius: 999px; padding: 0 10px; text-decoration: none;
        background: var(--brand-soft); color: var(--brand); border: 1px solid #ffd6c2; }
  .lb:hover { border-color: var(--brand); }
  .lb.cur { background: var(--brand); border-color: var(--brand); color: #fff; }
  .src { font-size: 11px; border-radius: 999px; padding: 0 9px; color: #fff; }
  .src.retrieval_low_conf { background: var(--blue); }
  .src.self_check { background: var(--amber); }
  .src.user_feedback { background: var(--red); }
  .occ { border: 1px solid var(--line); border-radius: 999px; padding: 0 9px;
         background: #f3f4f6; color: #6b7280; }
  .st { font-size: 12px; border-radius: 999px; padding: 1px 10px; }
  .st.待审 { color: var(--amber); background: #fef3c7; }
  .st.通过 { color: var(--green); background: #dcfce7; }
  .st.驳回 { color: var(--muted); background: #f3f4f6; }
  .time { margin-left: auto; }
  /* 底部翻页 */
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
  .pager button { border: 1px solid var(--line); background: #fff; border-radius: 8px;
                  padding: 6px 16px; cursor: pointer; font-size: 13px; }
  .pager button:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .pager button:disabled { color: #c2c8d4; cursor: not-allowed; }
  .pager .pg { color: var(--muted); font-size: 13px; }
  .empty { padding: 40px; text-align: center; color: var(--muted);
           background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div data-admin-nav-anchor></div>
  <header>
    <div class="logo">🐱</div>
    <div><h1>类目问题</h1><div class="sub" id="sub">喵喵优选 · 按类目翻看具体问题</div></div>
  </header>

  <div class="chips" id="chips"></div>
  <div class="list" id="list" hidden></div>
  <div class="empty" id="empty" hidden>该类目还没有归类问题。</div>
  <div class="pager" id="pager" hidden>
    <button id="prev">← 上一页</button>
    <span class="pg" id="pg"></span>
    <button id="next">下一页 →</button>
  </div>
</div>

<script src="/static/admin.js"></script>
<script>
(function () {
  'use strict';
  mountAdminNav('topics');

  var $ = function (id) { return document.getElementById(id); };
  var SOURCE_LABEL = { retrieval_low_conf: '检索置信度低', self_check: '模型自评不足', user_feedback: '用户反馈' };

  // 类目与页码都走地址栏:贴给别人也能打开,刷新回到同一页
  var params = new URLSearchParams(location.search);
  var label = params.get('label') || '';
  var page = Math.max(1, parseInt(params.get('page'), 10) || 1);

  function fmtTime(s) { return (s || '').replace('T', ' ').slice(0, 16); }
  function qUrl(lb, pg) { return '/topics/questions?label=' + encodeURIComponent(lb) + '&page=' + pg; }

  function go(pg) { location.href = qUrl(label, pg); }   // 整页跳转,地址栏即状态

  function renderChips(classes) {
    var box = $('chips');
    classes.forEach(function (c) {
      var a = document.createElement('a');
      a.className = 'chip' + (c.label === label ? ' on' : '');
      a.href = qUrl(c.label, 1);           // 换类回第一页
      a.textContent = c.label;
      var n = document.createElement('i'); n.textContent = c.count;
      a.appendChild(n);
      box.appendChild(a);
    });
  }

  function pill(cls, text, title) {
    var s = document.createElement('span');
    s.className = cls; s.textContent = text;
    if (title) s.title = title;
    return s;
  }

  function render(d) {
    $('sub').textContent = '喵喵优选 ·「' + d.label + '」共 ' + d.total + ' 条';
    document.title = 'MewHelp · ' + d.label;

    var list = $('list');
    list.textContent = '';
    $('empty').hidden = d.items.length > 0;
    list.hidden = d.items.length === 0;

    d.items.forEach(function (it) {
      var card = document.createElement('div'); card.className = 'card';
      // 标准化问法在上,用户原话在下
      var text = document.createElement('div'); text.className = 'text'; text.textContent = it.text;
      card.appendChild(text);
      if (it.normalized) {
        var raw = document.createElement('div'); raw.className = 'rawline';
        raw.textContent = '用户原话:' + it.raw;
        card.appendChild(raw);
      }

      var meta = document.createElement('div'); meta.className = 'meta';
      (it.labels || []).forEach(function (lb) {
        var a = document.createElement('a');
        a.className = 'lb' + (lb === d.label ? ' cur' : '');
        a.href = qUrl(lb, 1);
        a.textContent = lb;
        meta.appendChild(a);
      });
      if (it.source) meta.appendChild(pill('src ' + it.source, SOURCE_LABEL[it.source] || it.source));
      if (it.occurrence_count > 1) {
        meta.appendChild(pill('occ', '同义合并 ×' + it.occurrence_count, '归并前的同义说法条数'));
      }
      if (it.review_status) meta.appendChild(pill('st ' + it.review_status, it.review_status));
      var time = document.createElement('span'); time.className = 'time';
      time.textContent = fmtTime(it.classified_at);
      meta.appendChild(time);
      card.appendChild(meta);

      list.appendChild(card);
    });

    // 翻页
    $('pager').hidden = d.pages <= 1 && d.total <= d.size;
    $('pg').textContent = '第 ' + d.page + ' / ' + d.pages + ' 页 · 共 ' + d.total + ' 条';
    $('prev').disabled = d.page <= 1;
    $('next').disabled = d.page >= d.pages;
  }

  fetch('/api/topics/distribution')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var classes = (d.classes || []).slice().sort(function (a, b) { return b.count - a.count; });
      if (!label && classes.length) {
        // 地址栏没带类目:落到问题最多的一类,replace 不多留一条历史
        label = classes[0].label;
        location.replace(qUrl(label, page));
        return;
      }
      renderChips(classes);
      fetch('/api/topics/questions?label=' + encodeURIComponent(label) + '&page=' + page)
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(function () {
          $('empty').hidden = false;
          $('empty').textContent = '问题列表加载失败——确认主应用在线后刷新。';
        });
    })
    .catch(function () {
      $('empty').hidden = false;
      $('empty').textContent = '类目加载失败——确认主应用在线后刷新。';
    });

  $('prev').addEventListener('click', function () { go(page - 1); });
  $('next').addEventListener('click', function () { go(page + 1); });
})();
</script>
</body>
</html>
